name: Browser smoke tests
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify playable build and run Node tests
        run: |
          test -s index.html
          node --check src/game-engine.js
          npm test
      - name: Install browser test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright gameplay tests
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload failed-test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recreated-playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
