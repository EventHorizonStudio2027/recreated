name: Verify browser game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser game entrypoint and engine
        run: |
          test -s index.html
          node --check src/game-engine.js
          npm test
      - name: Install Playwright and browsers
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recreated-main-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
